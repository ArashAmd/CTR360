<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kart Racer — playable prototype</title>
<style>
html,body{margin:0;height:100%;background:#10151d;color:#fff;font-family:system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh}#help{position:fixed;left:18px;top:16px;background:#10151dcc;border:1px solid #ffffff35;border-radius:12px;padding:12px 15px;line-height:1.45;font-size:13px;backdrop-filter:blur(5px)}#help b{font-size:15px}#hud{position:fixed;right:18px;top:16px;text-align:right;background:#10151dcc;border:1px solid #ffffff35;border-radius:12px;padding:12px 15px;min-width:130px}#speed{font-size:30px;font-weight:800;line-height:1.1}#msg{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#10151dcc;border:1px solid #ffffff35;border-radius:999px;padding:9px 17px;font-size:13px;white-space:nowrap}
</style></head><body>
<canvas id="game" width="1280" height="720" aria-label="Kart racing prototype"></canvas>
<div id="help"><b>KART RACER — prototype 0.1</b><br>W / ↑ accelerate · S / ↓ brake<br>A / ← and D / → steer<br>R reset · P pause</div>
<div id="hud"><div id="speed">000</div><div>KM/H</div><div id="lap">LAP 1 / 3</div></div>
<div id="msg">Prototype for testing handling only — not an Xbox 360 build</div>
<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d');
const speedEl=document.getElementById('speed'),lapEl=document.getElementById('lap');
const W=1280,H=720, horizon=245;
let pos=0, lateral=0, velocity=0, steer=0, lap=1, paused=false, last=performance.now(), total=0;
const keys=new Set();
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys.add(k);if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(k==='p')paused=!paused;if(k==='r')reset();});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
function reset(){pos=0;lateral=0;velocity=0;steer=0;lap=1;total=0;}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function curveAt(z){return Math.sin(z*.00042)*.7+Math.sin(z*.00019+1.5)*.45;}
function roadCenter(y){const depth=(H-y)/(H-horizon);return W/2 + curveAt(pos+depth*1500)*depth*440-lateral*depth*270;}
function poly(points,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fill();}
function draw(){
 const sky=ctx.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#5bb7ef');sky.addColorStop(1,'#d5f1ff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,horizon);
 // distant hills
 poly([[0,245],[0,205],[90,165],[175,205],[275,150],[390,211],[520,174],[650,218],[780,158],[905,210],[1040,160],[1160,205],[1280,168],[1280,255]],'#709e7b');
 ctx.fillStyle='#78bd62';ctx.fillRect(0,horizon,W,H-horizon);
 // road strips drawn from horizon to foreground in perspective
 for(let i=0;i<44;i++){
  const t=i/44, t2=(i+1)/44;const y1=horizon+Math.pow(t,1.65)*(H-horizon),y2=horizon+Math.pow(t2,1.65)*(H-horizon);
  const d1=(y1-horizon)/(H-horizon),d2=(y2-horizon)/(H-horizon);
  const width1=50+Math.pow(d1,1.4)*590,width2=50+Math.pow(d2,1.4)*590;
  const center1=roadCenter(y1),center2=roadCenter(y2);
  const stripe=(Math.floor((pos/110)+i)%2===0);
  poly([[center1-width1*1.12,y1],[center1+width1*1.12,y1],[center2+width2*1.12,y2],[center2-width2*1.12,y2]],stripe?'#f3f0e8':'#d8d5ce');
  poly([[center1-width1,y1],[center1+width1,y1],[center2+width2,y2],[center2-width2,y2]],Math.floor((pos/130)+i)%2===0?'#454b55':'#3d434c');
  // dashed centerline
  if(Math.floor((pos/160)+i)%2===0){poly([[center1-2-d1*2,y1],[center1+2+d1*2,y1],[center2+2+d2*2,y2],[center2-2-d2*2,y2]],'#f8e7a1');}
 }
 // trees and colorful trackside markers
 for(let side of [-1,1])for(let i=0;i<18;i++){
  const depth=((i/18 + (pos/900)%1)%1);const y=horizon+Math.pow(depth,1.65)*(H-horizon);const d=(y-horizon)/(H-horizon);const center=roadCenter(y);const x=center+side*(70+Math.pow(d,1.4)*630);const s=8+Math.pow(d,1.3)*35;
  if(i%2===0){ctx.fillStyle='#65452f';ctx.fillRect(x-s*.12,y-s*1.1,s*.24,s*1.1);poly([[x,y-s*2.2],[x-s*.75,y-s*.55],[x+s*.75,y-s*.55]],'#176b42');poly([[x,y-s*1.8],[x-s*.58,y-s*.35],[x+s*.58,y-s*.35]],'#23874b');}
  else {ctx.fillStyle='#ffce58';ctx.fillRect(x-s*.25,y-s*.75,s*.5,s*.75);ctx.fillStyle='#e44e42';ctx.fillRect(x-s*.25,y-s*.75,s*.5,s*.25);}
 }
 // kart shadow and kart body
 const steerVisual=steer*12 + (lateral*.15);ctx.save();ctx.translate(W/2+steerVisual,H-128);ctx.rotate(-steer*.11);
 ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(0,37,82,25,0,0,Math.PI*2);ctx.fill();
 // wheels
 ctx.fillStyle='#171a20';ctx.fillRect(-66,-4,28,55);ctx.fillRect(38,-4,28,55);
 ctx.fillStyle='#d6dce3';ctx.fillRect(-60,8,14,24);ctx.fillRect(44,8,14,24);
 // chassis and nose
 poly([[-58,12],[-44,-37],[-25,-55],[25,-55],[44,-37],[58,12],[43,39],[-43,39]],'#e9473f');
 poly([[-42,-34],[-24,-54],[24,-54],[42,-34],[30,-12],[-30,-12]],'#f47a45');
 poly([[-24,-49],[24,-49],[18,-26],[-18,-26]],'#9edcf4');
 ctx.fillStyle='#ffe26a';ctx.fillRect(-42,3,17,9);ctx.fillRect(25,3,17,9);
 ctx.fillStyle='#ffffff';ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillText('K',0,21);
 ctx.restore();
 // small speed trail
 if(velocity>16){ctx.globalAlpha=.25;ctx.strokeStyle='#fff';ctx.lineWidth=3;for(let i=0;i<5;i++){let x=W/2-55+i*27;ctx.beginPath();ctx.moveTo(x,H-60);ctx.lineTo(x+(Math.random()-.5)*8,H-35);ctx.stroke();}ctx.globalAlpha=1;}
}
function frame(now){let dt=Math.min((now-last)/1000,.04);last=now;if(!paused){const up=keys.has('w')||keys.has('arrowup'),down=keys.has('s')||keys.has('arrowdown'),left=keys.has('a')||keys.has('arrowleft'),right=keys.has('d')||keys.has('arrowright');
 velocity+= (up?17:0)*dt;velocity-=(down?27:0)*dt;velocity-=velocity>0?2.1*dt:-2.1*dt;velocity=clamp(velocity,-4,37);steer+=( (right?1:0)-(left?1:0) - steer)*Math.min(1,dt*7);lateral+=steer*velocity*dt*.62;lateral=clamp(lateral,-1.25,1.25);if(Math.abs(lateral)>1.0)velocity=Math.max(5,velocity-13*dt);pos+=Math.max(0,velocity)*dt*40;total+=dt;if(total>42){lap=3;total=0;}lapEl.textContent='LAP '+lap+' / 3';}
 speedEl.textContent=String(Math.round(Math.abs(velocity)*5.2)).padStart(3,'0');draw();if(paused){ctx.fillStyle='#0009';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 52px system-ui';ctx.textAlign='center';ctx.fillText('PAUSED',W/2,H/2);}requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script></body></html>
